<body class="page">

  <div id="site-header"></div>

  <div id="smooth-wrapper">
    <div id="smooth-content">
      <main>

        <div class="header-image-wrapper">
          <div class="header-image" style="background-image:url(images/placeholders/photo-05.svg)"></div>
        </div>
        <!-- NEWS STORY TEMPLATE: copy this file for each new story -->
        <div class="standard_page">
          <div class="aside-components"><nav class="side-nav" data-auto></nav></div>
          <div class="main-components">
            <div class="post_heading">
              <h1>News <span class="subtitle"><span class="tbc">[News story title]</span></span> <span class="date"><span class="tbc">[DD.MM.YYYY]</span></span></h1>
            </div>
            <section class="textContent">
              <div class="content-typography">
              <p><span class="tbc">[Story text]</span></p>
              <img src="images/placeholders/photo-06.svg" alt="(replace with a captioned photo)">
              </div>
            </section>
            <div class="search-pager">
              <a class="back" href="news.html">&larr; Back to news</a>
              <div class="share" data-auto></div>
            </div>
          </div>
        </div>
      </main>
      <div id="site-footer"></div>
    </div>
  </div>
